<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/figma/logo-red.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffbf0" />
    <meta name="description" content="Espas.you — an interactive, coded prototype of a trust-first rental app for the Philippines. Tenant and landlord journeys, built from the Figma hi-fi." />
    <title>Espas.you Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mona+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Test hook: ?raf drives animations with timers so headless / hidden
      // browser panes (which pause requestAnimationFrame) can be verified.
      if (location.search.includes('raf')) window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
